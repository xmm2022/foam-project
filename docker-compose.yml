version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.4
    container_name: foam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-foam123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-foam}
      MYSQL_USER: ${MYSQL_USER:-foam}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foam123456}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: foam-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-foam123456}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-foam123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Foam API 后端
  foam-api:
    build:
      context: ./foam-api-v2
      dockerfile: Dockerfile
    container_name: foam-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILE: prod
      # 数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-foam}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-foam}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-foam123456}
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-foam123456}
      # Sa-Token 配置
      SA_TOKEN_TOKEN_NAME: token
      SA_TOKEN_TIMEOUT: 86400
      SA_TOKEN_ACTIVE_TIMEOUT: 36000
      SA_TOKEN_IS_CONCURRENT: true
      SA_TOKEN_IS_SHARE: false
      SA_TOKEN_TOKEN_STYLE: uuid
      # JVM 参数
      JVM_OPTS: "-Xms512m -Xmx1024m"
      # 代理配置（可选）
      HTTP_PROXY_ENABLED: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - foam_data:/app/data

  # Foam Web 前端
  foam-web:
    build:
      context: ./foam-web
      dockerfile: Dockerfile
    container_name: foam-web
    restart: unless-stopped
    depends_on:
      - foam-api
    environment:
      API_BASE_URL: http://foam-api:8080
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  foam_data:
    driver: local
