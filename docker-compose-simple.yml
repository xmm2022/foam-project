version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.4
    container_name: foam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: foam123456
      MYSQL_DATABASE: foam
      MYSQL_USER: foam
      MYSQL_PASSWORD: foam123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: foam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass foam123456
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "foam123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Foam API 后端 (使用原始镜像)
  foam-api:
    image: ciwei123321/foam-api-v2:latest
    container_name: foam-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/foam?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: foam
      SPRING_DATASOURCE_PASSWORD: foam123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: foam123456
    ports:
      - "8080:8080"
    volumes:
      - foam_data:/app/data

  # Foam Web 前端 (使用原始镜像)
  foam-web:
    image: ciwei123321/foam-web:latest
    container_name: foam-web
    restart: unless-stopped
    depends_on:
      - foam-api
    environment:
      API_BASE_URL: http://foam-api:8080
    ports:
      - "80:80"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  foam_data:
    driver: local
